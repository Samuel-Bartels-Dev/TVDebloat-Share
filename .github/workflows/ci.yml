name: TVDebloat CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tvdebloat-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile
        run: python -m compileall -q tvdebloat tests
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          tvdebloat --help
          tvdebloat profile-promote --help
          tvdebloat preflight --help

  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Clean-room repository guard
        run: |
          test ! -d launcher
          test ! -d addons
          test ! -d themes
          test ! -d tools
          ! git grep -n -E 'Gathin23/cleanyourtv|cleanyour\.tv|com\.gathin\.' --             README.md RUNBOOK.md ARCHITECTURE.md docs tvdebloat tests profiles examples .agents .claude
      - name: No private runtime material
        run: |
          ! find . -type f \( -name 'adbkey' -o -name 'adbkey.pub' -o -name '*.bak' \) -print -quit | grep -q .
