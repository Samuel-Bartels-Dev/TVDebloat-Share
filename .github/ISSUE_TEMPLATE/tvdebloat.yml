name: TVDebloat bug or device finding
description: Report a TVDebloat regression, unsupported firmware behavior, or profile issue
title: "[TVDebloat] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove IP addresses, Wi-Fi names, MAC addresses, serial numbers, account data, credentials, tokens, and ADB keys before submitting.

  - type: dropdown
    id: kind
    attributes:
      label: Type
      options:
        - Tool bug
        - Preflight / connection
        - Profile issue
        - Device compatibility finding
        - Safety check
        - Restore / recovery
        - Documentation
    validations:
      required: true

  - type: input
    id: model
    attributes:
      label: TV model
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Android version and firmware/build
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Redacted output / report
      render: shell

  - type: checkboxes
    id: safety
    attributes:
      label: Privacy and safety
      options:
        - label: I removed sensitive network/account/device-identifying information.
          required: true
        - label: I stopped additional risky changes after the unexpected failure.
          required: true
